<h1><code>capstone</code></h1>
<p class="unit-tagline">1–3 章驗收：五個實戰情境、14 題。不考名詞，只考判斷——該用誰？順序為？哪裡會炸？</p>

<section class="stat">
  <span class="stat-title">🎯 規則</span>
  <ul style="margin:.3rem 0; padding-left:1.3rem">
    <li>題型混合：單選、複選、<strong>排序</strong>（依正確順序逐一點選）、<strong>配對</strong>（每列下拉選單）。全程點選，不用打字。</li>
    <li>情境刻意跨單元組合，選項裡埋了「聽起來對但推理錯」的陷阱——比單元測驗難是故意的。</li>
    <li>80% 通過（12/14）。答錯就讀解析，每個解析都標了對應的觀念出處。</li>
