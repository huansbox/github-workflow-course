# 跨裝置進度同步（issue-ops）：
# 課程網站的「儲存進度」按鈕會開啟預填 issue（label: progress）。
# 本 workflow 驗證發起人是 repo 擁有者後，把進度碼寫進 progress.json、
# 關閉該 issue，再顯式 dispatch deploy.yml——因為 GITHUB_TOKEN 做的 push
# 不會觸發其他 workflow（第 10 單元教的事件抑制），部署必須自己接力。
name: Save quiz progress

on:
  issues:
    types: [labeled]
  # 手動後門：labeled 事件漏接或處理失敗時，可指定 issue 補跑
  workflow_dispatch:
    inputs:
      issue_number:
        description: "要重新處理的 progress issue 編號"
        required: true

permissions:
  contents: write
  issues: write
  actions: write

# 儲存動作序列化，避免兩筆進度同時 push 打架
concurrency:
  group: save-progress
  cancel-in-progress: false

jobs:
  save:
    # 事件路徑的守門：label 必須是 progress，且 issue 是擁有者本人開的
    # （public repo 誰都能開 issue——第 8 單元的防護清單原則）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'progress' &&
       github.event.issue.user.login == 'huansbox')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Extract, validate, save, close, redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # workflow_dispatch 路徑進不了上面的 if 守門，作者要在這裡重新驗證
          author=$(gh api "repos/$REPO/issues/$NUM" --jq .user.login)
          if [ "$author" != "huansbox" ]; then
            echo "::notice::issue #$NUM 的作者是 $author，不是擁有者——不處理"
            exit 0
          fi

          gh api "repos/$REPO/issues/$NUM" --jq .body > body.md

          # 取第一個 code fence 的內容作為進度碼
          awk '/^```/{f++; next} f==1' body.md > code.json

          # 驗證結構：v==1、units 是物件、key 符合單元命名格式
          jq -e '
            .v == 1 and (.units | type == "object") and
            ([.units | to_entries[]
              | select((.key | test("^[0-9]{2}-[a-z0-9-]+$")) | not)]
             | length == 0)
          ' code.json > /dev/null

          # 重建而非照抄：只取預期欄位、數值夾在 0–100（不直接信任 issue 內容）
          jq '{v: 1, ts: (now | todate), units: (.units | with_entries({
                key: .key,
                value: {
                  best:  ((.value.best  // 0) | if type == "number" then . else 0 end
                          | if . < 0 then 0 elif . > 100 then 100 else . end),
                  last:  ((.value.last  // 0) | if type == "number" then . else 0 end
                          | if . < 0 then 0 elif . > 100 then 100 else . end),
                  total: ((.value.total // 0) | if type == "number" then . else 0 end),
                  ts:    (.value.ts | if type == "string" then . else null end)
                }
              }))}' code.json > progress.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress.json
          if git diff --cached --quiet; then
            echo "progress.json 無變化，略過 commit"
          else
            git commit -m "chore: save quiz progress snapshot (#$NUM)"
            git pull --rebase origin main
            git push origin main
          fi

          gh issue close "$NUM" --repo "$REPO" \
            --comment "✅ 進度已存入 progress.json 並觸發網站重新部署。此 issue 由 save-progress workflow 自動關閉。"

          # GITHUB_TOKEN 的 push 不會觸發 deploy.yml——顯式接力（需要 actions: write）
          gh workflow run deploy.yml --repo "$REPO" --ref main
